<div class="holidays-container">
    <h2>Jours Fériés</h2>
    
    <div class="controls">
      <div class="form-group">
        <label for="year">Année:</label>
        <input type="number" id="year" [(ngModel)]="year" (change)="onYearChange(year)" min="2000" max="2100">
      </div>
      
      <div class="form-group">
        <label for="country">Pays:</label>
        <select id="country" [(ngModel)]="country" (change)="onCountryChange(country)">
          <option value="MA">Maroc</option>
          <option value="FR">France</option>
          <option value="TN">Tunisie</option>
          <option value="DZ">Algérie</option>
          <option value="US">États-Unis</option>
        </select>
      </div>
    </div>
  
    <div *ngIf="loading" class="loading">Chargement en cours...</div>
    
    <div *ngIf="error" class="error">{{ error }}</div>
  
    <div *ngIf="holidays.length > 0" class="holidays-list">
      <div class="holiday-card" *ngFor="let holiday of holidays">
        <h3>{{ holiday.name }}</h3>
        <p><strong>Date:</strong> {{ holiday.date | date:'fullDate' }}</p>
        <p>{{ holiday.description }}</p>
      </div>
    </div>
  
    <div *ngIf="holidays.length === 0 && !loading" class="no-holidays">
      Aucun jour férié trouvé pour cette année.
    </div>
  </div>
